<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tooltip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px; height: 14px;
            background: #3f3f46; color: #a1a1aa;
            border-radius: 50%; font-size: 10px;
            cursor: help; margin-left: 6px;
            position: relative;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 240px;
            background-color: #18181b;
            color: #d4d4d8;
            text-align: center;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 10px;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
            line-height: 1.4;
            white-space: normal;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-black text-white">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6 border-r border-zinc-800">
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="logo-container"><img src="logo.png" alt="Logo" class="logo-img"></div>
                <span class="text-xl font-bold tracking-tight">Portfolio</span>
            </div>
            <div class="flex gap-4 px-1">
                <a href="https://stocksandcoffee.substack.com/" target="_blank" class="social-icon"><i data-lucide="bookmark" class="w-4 h-4 text-zinc-500"></i></a>
                <a href="https://x.com/StocksandCoffe" target="_blank" class="social-icon"><i data-lucide="x" class="w-4 h-4 text-zinc-500"></i></a>
            </div>
        </div>
        <nav class="space-y-2 flex-1">
            <div class="nav-item active flex items-center gap-3 p-3 rounded-xl bg-emerald-500/10 text-emerald-400">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Performance</span>
            </div>
            <div onclick="window.location.href='holdings.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                <span>Holdings</span>
            </div>
            <div onclick="window.location.href='index.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>Home</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <header class="flex justify-between items-end mb-8">
            <div>
                <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                <div class="flex items-center gap-3">
                    <h1 id="hero-val" class="text-5xl font-bold">£0.00</h1>
                    <span id="hero-badge" class="hidden"></span>
                </div>
            </div>
            <p id="date-label" class="text-zinc-500 text-sm">--/--/----</p>
        </header>

        <div class="flex gap-2 mb-8">
            <button id="p-all" onclick="updatePeriod('all')" class="period-btn active px-4 py-2">Since Inception</button>
            <button id="p-ytd" onclick="updatePeriod('ytd')" class="period-btn px-4 py-2">YTD</button>
            <button id="p-1y" onclick="updatePeriod('1y')" class="period-btn px-4 py-2">1Y</button>
        </div>

        <div class="card p-6 mb-8 bg-zinc-900/20 border border-zinc-800 rounded-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-semibold text-zinc-300">Portfolio Growth</h3>
                <div class="flex bg-black/40 p-1 rounded-xl">
                    <button id="btn-growth" onclick="updateChartMode('growth')" class="toggle-btn active px-4 py-1.5 text-xs">Value</button>
                    <button id="btn-profit" onclick="updateChartMode('profit')" class="toggle-btn px-4 py-1.5 text-xs ml-1">Profit</button>
                </div>
            </div>
            <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6 border-l-4 border-emerald-500 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">Sharpe Ratio
                    <span class="tooltip">? <span class="tooltiptext">Measures risk-adjusted return. A higher ratio indicates better returns for the amount of risk taken.</span></span>
                </p>
                <p id="stat-sharpe" class="text-3xl font-bold text-zinc-300">0.00</p>
            </div>
            </div>
    </main>
    <script src="performance.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
