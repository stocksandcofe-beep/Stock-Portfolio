<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-black text-white">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6 border-r border-zinc-800">
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo" class="logo-img">
                </div>
                <span class="text-xl font-bold tracking-tight">Portfolio</span>
            </div>
            <div class="flex gap-4 px-1">
                <a href="https://stocksandcoffee.substack.com/" target="_blank" class="social-icon">
                    <i data-lucide="bookmark" class="w-4 h-4 text-zinc-500 hover:text-emerald-400 transition-colors"></i>
                </a>
                <a href="https://x.com/StocksandCoffe" target="_blank" class="social-icon">
                    <i data-lucide="x" class="w-4 h-4 text-zinc-500 hover:text-emerald-400 transition-colors"></i>
                </a>
            </div>
        </div>
        <nav class="space-y-2 flex-1">
            <div onclick="window.location.href='performance.html'" class="nav-item active flex items-center gap-3 p-3 rounded-xl bg-emerald-500/10 text-emerald-400">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Performance</span>
            </div>
            <div onclick="window.location.href='holdings.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                <span>Holdings</span>
            </div>
            <div onclick="window.location.href='allocator.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>Asset Allocator</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <header class="flex justify-between items-end mb-8">
            <div>
                <p class="text-zinc-500 text-sm mb-1 font-medium">Total Net Value</p>
                <div class="flex items-center gap-4">
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                    <span id="hero-badge" class="hidden px-2 py-1 rounded-lg text-xs font-bold"></span>
                </div>
            </div>
            <div class="text-right">
                <p id="date-label" class="text-zinc-500 text-sm font-mono uppercase tracking-wider">--/--/----</p>
            </div>
        </header>

        <div class="flex gap-2 mb-8">
            <button id="p-all" onclick="updatePeriod('all')" class="period-btn active px-4 py-2 text-sm font-medium rounded-lg border border-zinc-800 hover:bg-zinc-900 transition-all">Since Inception</button>
            <button id="p-ytd" onclick="updatePeriod('ytd')" class="period-btn px-4 py-2 text-sm font-medium rounded-lg border border-zinc-800 hover:bg-zinc-900 transition-all">YTD</button>
            <button id="p-1y" onclick="updatePeriod('1y')" class="period-btn px-4 py-2 text-sm font-medium rounded-lg border border-zinc-800 hover:bg-zinc-900 transition-all">1Y</button>
            <button id="p-ly" onclick="updatePeriod('ly')" class="period-btn px-4 py-2 text-sm font-medium rounded-lg border border-zinc-800 hover:bg-zinc-900 transition-all">Last Year</button>
        </div>

        <div class="card p-6 mb-8 bg-zinc-900/30 border border-zinc-800 rounded-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-semibold text-zinc-300">Portfolio Growth</h3>
                <div class="flex bg-black/40 p-1 rounded-xl border border-zinc-800">
                    <button id="btn-growth" onclick="updateChartMode('growth')" class="toggle-btn active px-4 py-1.5 text-xs font-bold rounded-lg transition-all">Value</button>
                    <button id="btn-profit" onclick="updateChartMode('profit')" class="toggle-btn px-4 py-1.5 text-xs font-bold rounded-lg transition-all ml-1">Profit</button>
                </div>
            </div>
            <div class="h-[350px]">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="card p-6 border-l-4 border-emerald-500 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">Total Return</p>
                <p id="stat-total-return" class="text-3xl font-bold text-emerald-400">0.00%</p>
            </div>
            <div class="card p-6 border-l-4 border-emerald-500 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">Net Profit</p>
                <p id="stat-profit" class="text-3xl font-bold text-emerald-400">£0.00</p>
            </div>
            <div class="card p-6 border-l-4 border-zinc-700 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">Max Drawdown</p>
                <p id="stat-max-dd" class="text-3xl font-bold text-zinc-400">0.00%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6 border-l-4 border-blue-500 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">TWR Ratio</p>
                <p id="stat-twr" class="text-3xl font-bold text-blue-400">0.00%</p>
            </div>
            <div class="card p-6 border-l-4 border-zinc-700 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">Sharpe Ratio</p>
                <p id="stat-sharpe" class="text-3xl font-bold text-zinc-400">0.00</p>
            </div>
            <div class="card p-6 border-l-4 border-amber-500 bg-zinc-900/20 rounded-xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-2">Beta</p>
                <p id="stat-beta" class="text-3xl font-bold text-amber-400">0.00</p>
            </div>
        </div>
    </main>

    <script src="performance.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
