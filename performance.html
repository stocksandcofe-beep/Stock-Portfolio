<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-black text-white">

    <aside class="sidebar w-64 flex flex-col p-6 border-r border-zinc-800">
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo" class="logo-img">
                </div>
                <span class="text-xl font-bold tracking-tight">Portfolio</span>
            </div>
            
            <div class="flex gap-4 px-1">
                <a href="https://stocksandcoffee.substack.com/" target="_blank" class="social-icon">
                    <i data-lucide="bookmark" class="w-4 h-4 text-zinc-500 hover:text-emerald-400 transition-colors"></i>
                </a>
                <a href="https://x.com/StocksandCoffe" target="_blank" class="social-icon">
                    <i data-lucide="x" class="w-4 h-4 text-zinc-500 hover:text-emerald-400 transition-colors"></i>
                </a>
            </div>
        </div>
        
        <nav class="space-y-2 flex-1">
            <div onclick="window.location.href='performance.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Performance</span>
            </div>
            <div onclick="window.location.href='holdings.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                <span>Holdings</span>
            </div>
            <div onclick="window.location.href='allocator.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors text-zinc-400">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>Asset Allocator</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <header class="flex justify-between items-end mb-8">
            <div>
                <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                <div class="flex items-center">
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
            </div>
            <div class="text-right"><p id="date-label" class="text-zinc-500 text-sm">--/--/----</p></div>
        </header>

        <div class="card p-6 mb-8">
            <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
        </div>
        <div id="metrics-grid"></div> 
    </main>

    <script src="performance.js"></script>
</body>
</html>
