<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; color: #71717a; }
        .nav-item.active { background: #10b9811a; color: #10b981; }
        .toggle-btn { cursor: pointer; transition: all 0.2s; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .toggle-btn.active { background: #10b981; color: #000; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-xl">
                <span>Dashboard</span>
            </div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-xl">
                <span>Holdings</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right">
                    <p id="date-label" class="text-zinc-500 text-sm">--/--/----</p>
                </div>
            </header>

            <div class="card p-6 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="chart-title" class="font-semibold text-zinc-300">Portfolio Growth</h3>
                    <div class="flex bg-black/40 p-1 rounded-xl">
                        <button id="btn-growth" onclick="updateChart('growth')" class="toggle-btn active px-4 py-1.5">Value</button>
                        <button id="btn-profit" onclick="updateChart('profit')" class="toggle-btn px-4 py-1.5 ml-1">Profit</button>
                    </div>
                </div>
                <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Net Profit</p>
                    <p id="stat-profit" class="text-2xl font-bold text-emerald-400">£0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Deposits</p>
                    <p id="stat-deposits" class="text-2xl font-bold">£0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Dividends & Fees</p>
                    <p id="stat-fees" class="text-2xl font-bold">£0.00</p>
                </div>
            </div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10">
                <h1 class="text-4xl font-bold tracking-tight">Your Assets</h1>
                <p class="text-zinc-500 mt-2">Asset values converted to GBP using live CSV rates.</p>
            </header>
            
            <div class="card overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-xs uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4">Company</th>
                            <th class="p-4">Ticker</th>
                            <th class="p-4 text-right">Shares</th>
                            <th class="p-4 text-right">Price</th>
                            <th class="p-4 text-right">£ Value</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800">
                        <tr><td colspan="5" class="p-10 text-center text-zinc-600">Syncing with Holdings.csv...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PERF_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        const HOLD_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Holdings.csv';
        
        let chartInstance;
        let perfData = [];
        let rates = { USD: 1, EUR: 1 };

        function parseMoney(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            return parseFloat(val.replace(/[^0-9.-]+/g, "")) || 0;
        }

        Papa.parse(PERF_CSV, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                perfData = results.data.slice(1).filter(r => r[0] && r[49]);
                const latest = perfData[perfData.length - 1];
                rates.USD = parseMoney(latest[43]) || 1;
                rates.EUR = parseMoney(latest[45]) || 1;
                initDashboard();
            }
        });

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            document.getElementById('nav-dash').classList.toggle('active', pageId === 'dashboard');
            document.getElementById('nav-holdings').classList.toggle('active', pageId === 'holdings');
            if(pageId === 'holdings') renderHoldings();
        }

        function initDashboard() {
            const latest = perfData[perfData.length - 1];
            document.getElementById('hero-val').innerText = '£' + parseMoney(latest[49]).toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('date-label').innerText = latest[0];
            document.getElementById('stat-profit').innerText = '£' + parseMoney(latest[51]).toLocaleString();
            document.getElementById('stat-deposits').innerText = '£' + parseMoney(latest[50]).toLocaleString();
            document.getElementById('stat-fees').innerText = '£' + parseMoney(latest[48]).toLocaleString();
            renderChart('growth');
        }

        function renderChart(type) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const labels = perfData.map(r => r[0]);
            
            // Value is index 49, Profit is index 51
            const dataValues = type === 'growth' ? 
                perfData.map(r => parseMoney(r[49])) : 
                perfData.map(r => parseMoney(r[51]));
            
            const color = type === 'growth' ? '#10b981' : '#3b82f6';

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        borderColor: color,
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: color + '0D'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#52525b', font: { size: 10 } } }
                    }
                }
            });
        }

        function updateChart(type) {
            document.getElementById('btn-growth').classList.toggle('active', type === 'growth');
            document.getElementById('btn-profit').classList.toggle('active', type === 'profit');
            document.getElementById('chart-title').innerText = type === 'growth' ? 'Portfolio Growth' : 'Profit History';
            renderChart(type);
        }

        function renderHoldings() {
            Papa.parse(HOLD_CSV, {
                download: true, header: true, skipEmptyLines: true,
                transformHeader: h => h.trim(),
                complete: function(results) {
                    const tbody = document.getElementById('holdings-table-body');
                    tbody.innerHTML = '';
                    results.data.forEach(row => {
                        const currency = (row.Currency || 'USD').trim().toUpperCase();
                        const localVal = parseMoney(row['Local value']);
                        const price = parseMoney(row.Price);
                        let symbol = '$'; let rate = rates.USD;
                        if (currency === 'EUR') { symbol = '€'; rate = rates.EUR; }
                        if (currency === 'GBP') { symbol = '£'; rate = 1; }
                        const gbpTotal = localVal * rate;
                        tbody.innerHTML += `
                            <tr class="hover:bg-white/5 transition">
                                <td class="p-4 font-semibold text-white">${row.Company || 'Unknown'}</td>
                                <td class="p-4 text-xs font-bold text-zinc-500">${row.Ticker || '---'}</td>
                                <td class="p-4 text-right">${row.Shares || 0}</td>
                                <td class="p-4 text-right">${symbol}${price.toFixed(2)}</td>
                                <td class="p-4 text-right font-semibold text-emerald-400">£${gbpTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            </tr>`;
                    });
                }
            });
        }
    </script>
</body>
</html>
