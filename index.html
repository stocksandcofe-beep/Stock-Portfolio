<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks and Coffee</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@0.574.0"></script>
    </head>
<body class="flex h-screen overflow-hidden bg-black text-white">

    <aside class="sidebar w-64 flex flex-col p-6 border-r border-zinc-800">
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="logo-container">
                    <img src="Images/logo.png" alt="Stocks and Coffee logo" class="logo-img">
                </div>
                <span class="text-xl font-bold tracking-tight">Portfolio</span>
            </div>
            <div class="flex gap-4 px-1">
                <a href="https://stocksandcoffee.substack.com/" target="_blank" class="social-icon">
                    <img src="https://cdn.simpleicons.org/substack" class="w-4 h-4" alt="Substack">
                </a>
                <a href="https://x.com/StocksandCoffe" target="_blank" class="social-icon">
                    <div class="w-4 h-4 bg-black rounded-sm flex items-center justify-center">
                        <img src="https://cdn.simpleicons.org/x/white" class="w-3 h-3" alt="X">
                    </div>
                </a>
            </div>
        </div>
        <nav class="space-y-1 flex-1">
            <a href="performance.html" class="nav-item flex items-center gap-3 p-3 hover:bg-zinc-900 hover:text-emerald-400 transition-colors text-zinc-400">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Performance</span>
            </a>
            <div class="portfolio-nav-group">
                <div class="flex items-center">
                    <a href="holdings.html" class="nav-item flex items-center gap-3 p-3 hover:bg-zinc-900 hover:text-emerald-400 transition-colors">
                        <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                        <span>Portfolio Structure</span>
                    </a>
                    <button onclick="togglePortfolioNav()" class="px-2 py-3 text-zinc-500 hover:text-white transition-colors" title="Toggle submenu">
                        <i id="chevron-desktop" data-lucide="chevron-down" class="w-3 h-3" style="transition:transform 0.2s"></i>
                    </button>
                </div>
                <div id="portfolio-subnav-desktop">
                    <a href="sector.html" class="sub-nav-item flex items-center gap-2 ml-4 px-3 py-2 rounded-lg text-sm transition-colors">
                        <i data-lucide="pie-chart" class="w-3 h-3"></i>
                        <span>Sector &amp; Region</span>
                    </a>
                </div>
            </div>
            <a href="allocator.html" class="nav-item flex items-center gap-3 p-3 hover:bg-zinc-900 hover:text-emerald-400 transition-colors text-zinc-400">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>Asset Allocator</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex items-center justify-center p-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900/20 via-black to-black">
        <div class="text-center max-w-md">
            <h1 class="text-5xl font-bold mb-6 tracking-tighter">Welcome back</h1>
            <p class="text-zinc-500 text-lg leading-relaxed">Select a section from the sidebar to manage your assets or view performance analytics.</p>
        </div>
    </main>

    <script>

        function initPortfolioNav() {
            var isOpen = sessionStorage.getItem('portfolioNavOpen') !== 'false';
            ['desktop', 'mobile'].forEach(function(type) {
                var subnav = document.getElementById('portfolio-subnav-' + type);
                var chevron = document.getElementById('chevron-' + type);
                if (subnav) subnav.style.display = isOpen ? 'block' : 'none';
                if (chevron) chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(-90deg)';
            });
        }
        function togglePortfolioNav() {
            var isOpen = sessionStorage.getItem('portfolioNavOpen') !== 'false';
            sessionStorage.setItem('portfolioNavOpen', isOpen ? 'false' : 'true');
            initPortfolioNav();
            lucide.createIcons();
        }
        initPortfolioNav();
        lucide.createIcons();
    </script>
</body>
</html>
