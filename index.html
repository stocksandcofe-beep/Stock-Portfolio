<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="max-w-xl mx-auto py-10 px-4">
        <h1 class="text-2xl font-bold mb-6">My Portfolio</h1>
        
        <div id="status" class="text-sm text-gray-500 mb-4 italic">Connecting to GitHub...</div>

        <div id="portfolio-container" class="space-y-3">
            </div>
    </div>

   <script>
    const CSV_URL = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/data.csv';

    Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            const data = results.data;
            const container = document.getElementById('portfolio-container');
            const status = document.getElementById('status');

            if (data.length > 0) {
                status.innerText = "Data found! Displaying columns...";
                container.innerHTML = ''; 

                // Get the actual names of your columns from the first row
                const columns = Object.keys(data[0]);
                
                data.forEach(row => {
                    // This pulls whatever is in your 1st and 2nd columns
                    const col1 = row[columns[0]]; 
                    const col2 = row[columns[1]];

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between mb-2">
                            <span class="font-semibold">${col1}</span>
                            <span class="text-blue-600 font-mono">${col2}</span>
                        </div>
                    `;
                });
            } else {
                status.innerText = "The file was found, but it looks empty.";
            }
        }
    });
</script>
</body>
</html>
