<div id="page-dashboard">
    <header class="flex justify-between items-end mb-10">
        <div>
            <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
            <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
        </div>
        <div class="text-right">
            <p id="date-label" class="text-zinc-500 text-sm">--/--/----</p>
        </div>
    </header>

    <div class="flex gap-2 mb-6">
        <button id="p-all" onclick="changePeriod('all')" class="toggle-btn active px-4 py-2 border border-zinc-800">Since Inception</button>
        <button id="p-ytd" onclick="changePeriod('ytd')" class="toggle-btn px-4 py-2 border border-zinc-800">YTD</button>
        <button id="p-1y" onclick="changePeriod('1y')" class="toggle-btn px-4 py-2 border border-zinc-800">1Y</button>
        <button id="p-ly" onclick="changePeriod('ly')" class="toggle-btn px-4 py-2 border border-zinc-800">Last Year</button>
    </div>

    <div class="card p-6 mb-8">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-semibold text-zinc-300">Portfolio Growth</h3>
            <div class="flex bg-black/40 p-1 rounded-xl">
                <button id="btn-growth" onclick="updateChartType('growth')" class="toggle-btn active px-4 py-1.5">Value</button>
                <button id="btn-profit" onclick="updateChartType('profit')" class="toggle-btn px-4 py-1.5 ml-1">Profit</button>
            </div>
        </div>
        <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
    </div>
    
    </div>

<script>
    // ... (Keep existing variables like PERF_CSV, HOLD_CSV, chartInstance, perfData) ...
    let currentPeriod = 'all';
    let currentChartType = 'growth';

    // Helper: Parse MM/DD/YYYY from your CSV
    function parseDate(dateStr) {
        const parts = dateStr.split('/');
        return new Date(parts[2], parts[0] - 1, parts[1]);
    }

    function changePeriod(period) {
        currentPeriod = period;
        // Update button UI
        ['all', 'ytd', '1y', 'ly'].forEach(p => {
            document.getElementById(`p-${p}`).classList.toggle('active', p === period);
        });
        updateDashboard();
    }

    function updateChartType(type) {
        currentChartType = type;
        document.getElementById('btn-growth').classList.toggle('active', type === 'growth');
        document.getElementById('btn-profit').classList.toggle('active', type === 'profit');
        updateDashboard();
    }

    function updateDashboard() {
        if (!perfData.length) return;

        const latestDate = parseDate(perfData[perfData.length - 1][0]);
        const latestYear = latestDate.getFullYear();

        // Filter data based on period
        const filteredData = perfData.filter(row => {
            const d = parseDate(row[0]);
            if (currentPeriod === 'ytd') return d.getFullYear() === latestYear;
            if (currentPeriod === '1y') {
                const oneYearAgo = new Date(latestDate);
                oneYearAgo.setFullYear(latestDate.getFullYear() - 1);
                return d >= oneYearAgo;
            }
            if (currentPeriod === 'ly') return d.getFullYear() === (latestYear - 1);
            return true; // Since Inception
        });

        if (filteredData.length === 0) return;

        // Calculate Metrics for the specific period
        const latest = filteredData[filteredData.length - 1];
        const start = filteredData[0];
        
        const netProfit = cleanNum(latest[51]) - cleanNum(start[51]);
        const startValue = cleanNum(start[47]);
        const endValue = cleanNum(latest[47]);
        const deposits = cleanNum(latest[50]) - cleanNum(start[50]);

        // UI Updates
        document.getElementById('hero-val').innerText = '£' + endValue.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('stat-profit').innerText = '£' + netProfit.toLocaleString();
        
        // Return Calculation for the period
        const totalReturn = deposits !== 0 || startValue !== 0 ? (netProfit / (startValue + deposits)) * 100 : 0;
        document.getElementById('stat-total-return').innerText = totalReturn.toFixed(2) + '%';

        // TWR, Sharpe, and Max Drawdown logic should now use 'filteredData'
        calculateAdvancedMetrics(filteredData);

        // Render Chart
        renderMainChart(filteredData);
    }

    function renderMainChart(dataSubset) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        const labels = dataSubset.map(r => r[0]);
        const dataPoints = currentChartType === 'growth' 
            ? dataSubset.map(r => cleanNum(r[47])) 
            : dataSubset.map(r => cleanNum(r[51]));

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: dataPoints,
                    borderColor: currentChartType === 'growth' ? '#10b981' : '#3b82f6',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.2,
                    fill: true,
                    backgroundColor: 'rgba(16,185,129,0.05)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        ticks: {
                            color: '#52525b',
                            maxRotation: 0,
                            autoSkip: true,
                            callback: function(value, index, values) {
                                // X-axis label by Month
                                const date = parseDate(this.getLabelForValue(value));
                                return date.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
                            }
                        },
                        grid: { display: false }
                    },
                    y: {
                        position: 'right',
                        grid: { color: 'rgba(255,255,255,0.03)' },
                        ticks: { color: '#52525b', font: { size: 10 } }
                    }
                }
            }
        });
    }

    function calculateAdvancedMetrics(data) {

</script>
