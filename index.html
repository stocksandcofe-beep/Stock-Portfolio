<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; }
        .nav-item.active { background: #10b9811a; color: #10b981; }
        .toggle-btn.active { background: #10b981; color: #000; font-weight: 700; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-xl">
                <span>Dashboard</span>
            </div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-xl text-zinc-500 hover:text-white">
                <span>Holdings</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p class="text-zinc-500 text-sm mb-1">Net Total Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right"><p id="date-label" class="text-zinc-500 text-sm">--/--/----</p></div>
            </header>

            <div class="card p-6 mb-8">
                <div class="flex justify-between mb-8">
                    <h3 id="chart-title" class="font-semibold text-zinc-300">Performance</h3>
                    <div class="flex bg-black/40 p-1 rounded-xl">
                        <button id="btn-growth" onclick="updateChart('growth')" class="toggle-btn active px-4 py-1 rounded-lg text-[10px] uppercase">Growth</button>
                        <button id="btn-profit" onclick="updateChart('profit')" class="toggle-btn px-4 py-1 rounded-lg text-[10px] uppercase ml-1">Profit</button>
                    </div>
                </div>
                <div class="h-[320px]"><canvas id="mainChart"></canvas></div>
            </div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10">
                <h1 class="text-4xl font-bold tracking-tight">Current Holdings</h1>
                <p class="text-zinc-500 mt-2">Asset breakdown based on latest CSV data.</p>
            </header>
            
            <div class="card overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-xs uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4">Ticker</th>
                            <th class="p-4 text-right">Quantity</th>
                            <th class="p-4 text-right">Current Price</th>
                            <th class="p-4 text-right">Total Value</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const CSV_URL = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        let chartInstance;
        let globalData = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                globalData = results.data.filter(r => r.Date && r['Net Total Value GBP']);
                initUI();
            }
        });

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            document.getElementById('nav-dash').classList.toggle('active', pageId === 'dashboard');
            document.getElementById('nav-holdings').classList.toggle('active', pageId === 'holdings');
            if(pageId === 'holdings') renderHoldings();
        }

        function initUI() {
            const latest = globalData[globalData.length - 1];
            document.getElementById('hero-val').innerText = '£' + parseFloat(latest['Net Total Value GBP']).toLocaleString();
            document.getElementById('date-label').innerText = latest.Date;
            renderChart('growth');
        }

        function renderHoldings() {
            const latest = globalData[globalData.length - 1];
            const tbody = document.getElementById('holdings-table-body');
            tbody.innerHTML = '';
            
            // Your CSV has Ticker, then Quantity, then Value. 
            // We loop through the headers to find the stock names.
            const headers = Object.keys(latest);
            const stocks = ["WKL", "AAPL", "CL", "CNI", "GOOGL", "KO", "MCD", "NKE", "PGR", "TJX", "UL", "V", "WM", "WMT"];

            stocks.forEach(ticker => {
                const qtyIndex = headers.indexOf(ticker) + 1;
                const valIndex = headers.indexOf(ticker) + 2;
                const qty = latest[headers[qtyIndex]];
                const totalVal = latest[headers[valIndex]];
                const price = latest[ticker];

                if (qty && parseFloat(qty) > 0) {
                    tbody.innerHTML += `
                        <tr class="hover:bg-white/5 transition">
                            <td class="p-4 font-bold text-white">${ticker}</td>
                            <td class="p-4 text-right">${qty}</td>
                            <td class="p-4 text-right">$${parseFloat(price).toFixed(2)}</td>
                            <td class="p-4 text-right font-semibold text-emerald-400">$${parseFloat(totalVal).toLocaleString()}</td>
                        </tr>
                    `;
                }
            });
        }

        function renderChart(type) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const labels = globalData.map(r => {
                const p = r.Date.split('/');
                return new Date(p[2], p[0]-1, p[1]).toLocaleString('default', {month:'short', year:'2-digit'});
            });
            const config = type === 'growth' ? 
                { data: globalData.map(r => parseFloat(r['Net Total Value GBP'])), color: '#10b981' } : 
                { data: globalData.map(r => parseFloat(r['Net Profit'])), color: '#6366f1' };

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: config.data,
                        borderColor: config.color,
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: config.color + '11'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, 
                scales: { x: { grid: { display: false }, ticks: { color: '#52525b', maxTicksLimit: 12 } }, y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' } } } }
            });
        }

        function updateChart(type) {
            document.getElementById('btn-growth').classList.toggle('active', type === 'growth');
            document.getElementById('btn-profit').classList.toggle('active', type === 'profit');
            renderChart(type);
        }
    </script>
</body>
</html>
