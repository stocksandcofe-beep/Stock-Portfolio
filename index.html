<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E14; color: #FFFFFF; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
        .toggle-btn { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .toggle-btn.active { background: #10b981; color: #000; border-color: #10b981; font-weight: 700; }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <p class="text-zinc-500 text-sm font-medium mb-1">Portfolio Overview</p>
                <div class="flex items-baseline gap-4">
                    <h1 id="hero-value" class="text-5xl font-bold tracking-tight">£0.00</h1>
                    <span id="profit-badge" class="px-3 py-1 rounded-full text-xs font-bold">--</span>
                </div>
            </div>
            <div class="text-left md:text-right">
                <p id="update-date" class="text-zinc-500 text-xs font-bold uppercase tracking-widest">Last Updated: --</p>
            </div>
        </div>

        <div class="glass rounded-3xl p-6 mb-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                <h3 id="chart-title" class="font-semibold text-zinc-300">Net Total Value Over Time</h3>
                
                <div class="flex bg-black/40 p-1 rounded-xl">
                    <button id="toggle-growth" onclick="updateChartType('growth')" class="toggle-btn active px-4 py-1.5 rounded-lg text-xs uppercase tracking-wider">Growth</button>
                    <button id="toggle-profit" onclick="updateChartType('profit')" class="toggle-btn px-4 py-1.5 rounded-lg text-xs uppercase tracking-wider ml-1">Profit</button>
                </div>
            </div>

            <div class="h-[350px] w-full">
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Total Deposits</p>
                <p id="stat-deposits" class="text-2xl font-bold text-zinc-100">£0.00</p>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Dividends & Fees</p>
                <p id="stat-fees" class="text-2xl font-bold text-zinc-100">£0.00</p>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Current Net Profit</p>
                <p id="stat-profit" class="text-2xl font-bold text-emerald-400">£0.00</p>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        let chart;
        let portfolioData = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                portfolioData = results.data.filter(r => r.Date && r['Net Total Value GBP']);
                initDashboard();
            }
        });

        function initDashboard() {
            const latest = portfolioData[portfolioData.length - 1];
            
            // Top Stats
            document.getElementById('hero-value').innerText = `£${parseFloat(latest['Net Total Value GBP']).toLocaleString()}`;
            document.getElementById('update-date').innerText = `Last Updated: ${latest.Date}`;
            document.getElementById('stat-profit').innerText = `£${parseFloat(latest['Net Profit']).toLocaleString()}`;
            document.getElementById('stat-deposits').innerText = `£${parseFloat(latest['Cumulative Deposits']).toLocaleString()}`;
            document.getElementById('stat-fees').innerText = `£${parseFloat(latest['Dividends & Fees']).toLocaleString()}`;

            const profit = parseFloat(latest['Net Profit']);
            const badge = document.getElementById('profit-badge');
            badge.innerText = (profit >= 0 ? '↑ ' : '↓ ') + `£${Math.abs(profit).toLocaleString()}`;
            badge.className = profit >= 0 ? 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400' : 'px-3 py-1 rounded-full text-xs font-bold bg-rose-500/10 text-rose-400';

            createChart('growth');
        }

        function createChart(type) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            // Formatting Month Names for X-Axis
            const labels = portfolioData.map(r => {
                const dateParts = r.Date.split('/');
                const dateObj = new Date(dateParts[2], dateParts[0] - 1, dateParts[1]);
                return dateObj.toLocaleString('default', { month: 'short', year: '2-digit' });
            });

            const growthData = portfolioData.map(r => parseFloat(r['Net Total Value GBP']));
            const profitData = portfolioData.map(r => parseFloat(r['Net Profit']));

            const datasetConfig = {
                growth: {
                    label: 'Total Value (GBP)',
                    data: growthData,
                    color: '#10b981',
                    fill: 'rgba(16, 185, 129, 0.1)'
                },
                profit: {
                    label: 'Net Profit (GBP)',
                    data: profitData,
                    color: '#6366f1',
                    fill: 'rgba(99, 102, 241, 0.1)'
                }
            };

            const activeConfig = datasetConfig[type];

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: activeConfig.data,
                        borderColor: activeConfig.color,
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: activeConfig.fill
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            grid: { display: false },
                            ticks: { 
                                color: '#52525b', 
                                maxRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 8 // Shows months clearly
                            } 
                        },
                        y: { 
                            position: 'right',
                            grid: { color: 'rgba(255,255,255,0.03)' },
                            ticks: { color: '#52525b', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateChartType(type) {
            // Update Buttons
            document.getElementById('toggle-growth').classList.toggle('active', type === 'growth');
            document.getElementById('toggle-profit').classList.toggle('active', type === 'profit');
            document.getElementById('chart-title').innerText = type === 'growth' ? 'Net Total Value Over Time' : 'Net Profit Over Time';

            // Destroy and recreate chart with new data
            chart.destroy();
            createChart(type);
        }
    </script>
</body>
</html>
