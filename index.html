<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Analytics</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; color: #71717a; }
        .nav-item.active { background: #10b9811a; color: #10b981; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-xl">
                <span>Dashboard</span>
            </div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-xl">
                <span>Holdings</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right">
                    <p id="date-label" class="text-zinc-500 text-sm">--/--/----</p>
                </div>
            </header>

            <div class="card p-6 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="chart-title" class="font-semibold text-zinc-300">Portfolio Growth</h3>
                </div>
                <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="card p-6 border-l-4 border-emerald-500">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Net Profit</p>
                    <p id="stat-profit" class="text-2xl font-bold text-emerald-400">£0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Deposits</p>
                    <p id="stat-deposits" class="text-2xl font-bold">£0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Income (Divs/Fees)</p>
                    <p id="stat-fees" class="text-2xl font-bold">£0.00</p>
                </div>
            </div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10">
                <h1 class="text-4xl font-bold tracking-tight">Holdings</h1>
                <p class="text-zinc-500 mt-2">Asset allocation and performance breakdown.</p>
            </header>
            
            <div class="card overflow-x-auto">
                <table class="w-full text-left min-w-[900px]">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-[10px] uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4">Asset</th>
                            <th class="p-4 text-right">Shares</th>
                            <th class="p-4 text-right">Price</th>
                            <th class="p-4 text-right">GBP Value</th>
                            <th class="p-4 text-right">Profit/Loss (£)</th>
                            <th class="p-4 text-right">Return (%)</th>
                            <th class="p-4 text-right">Allocation</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PERF_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        const HOLD_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Holdings.csv';
        
        let chartInstance;
        let perfData = [];
        let rates = { USD: 1, EUR: 1 };
        let totalPortfolioValue = 0;

        function parseNum(val) {
            if (!val || val === "") return 0;
            return parseFloat(val.toString().replace(/[^0-9.-]+/g, "")) || 0;
        }

        // Search for column names flexibly
        function getField(row, targets) {
            const keys = Object.keys(row);
            for (let t of targets) {
                const match = keys.find(k => k.toLowerCase().trim().includes(t.toLowerCase()));
                if (match) return row[match];
            }
            return null;
        }

        // Initial Load from Performance CSV
        Papa.parse(PERF_CSV, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                perfData = results.data.slice(1).filter(r => r[0] && r[47]);
                const latest = perfData[perfData.length - 1];
                
                // Set FX Rates (Divides by local to get GBP multiplier)
                rates.USD = parseNum(latest[43]) || 1;
                rates.EUR = parseNum(latest[45]) || 1;
                totalPortfolioValue = parseNum(latest[47]);
                
                initDashboard();
            }
        });

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            document.getElementById('nav-dash').classList.toggle('active', pageId === 'dashboard');
            document.getElementById('nav-holdings').classList.toggle('active', pageId === 'holdings');
            if(pageId === 'holdings') renderHoldings();
        }

        function initDashboard() {
            const latest = perfData[perfData.length - 1];
            document.getElementById('hero-val').innerText = '£' + totalPortfolioValue.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('date-label').innerText = latest[0];
            document.getElementById('stat-profit').innerText = '£' + parseNum(latest[51]).toLocaleString();
            document.getElementById('stat-deposits').innerText = '£' + parseNum(latest[50]).toLocaleString();
            document.getElementById('stat-fees').innerText = '£' + parseNum(latest[48]).toLocaleString();
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const labels = perfData.map(r => r[0]);
            const values = perfData.map(r => parseNum(r[47]));
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        borderColor: '#10b981',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: 'rgba(16,185,129,0.05)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#52525b', font: { size: 10 } } }
                    }
                }
            });
        }

        function renderHoldings() {
            Papa.parse(HOLD_CSV, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const tbody = document.getElementById('holdings-table-body');
                    tbody.innerHTML = '';
                    
                    results.data.forEach(row => {
                        const ticker = getField(row, ['Ticker', 'Symbol']) || '---';
                        const shares = parseNum(getField(row, ['Shares', 'Qty']));
                        if (shares === 0) return;

                        const currency = (getField(row, ['Currency']) || 'USD').toUpperCase();
                        const rate = (currency === 'GBP') ? 1 : (currency === 'EUR' ? rates.EUR : rates.USD);
                        const symbol = (currency === 'GBP') ? '£' : (currency === 'EUR' ? '€' : '$');

                        // 1. Calculate Current Value (Local Price * Shares converted to GBP)
                        const localPrice = parseNum(getField(row, ['Price']));
                        const currentValGBP = (shares * localPrice) / rate;

                        // 2. Calculate Cost (Your "Total Cost" column converted to GBP)
                        const totalCostLocal = parseNum(getField(row, ['Total Cost', 'Cost Basis']));
                        const costGBP = totalCostLocal / rate;

                        // 3. Performance Math
                        const gbpProfit = currentValGBP - costGBP;
                        const returnPct = costGBP !== 0 ? (gbpProfit / costGBP) * 100 : 0;
                        const weight = totalPortfolioValue > 0 ? (currentValGBP / totalPortfolioValue) * 100 : 0;

                        tbody.innerHTML += `
                            <tr class="hover:bg-white/5 transition border-b border-zinc-800/50">
                                <td class="p-4">
                                    <div class="font-bold text-white">${getField(row, ['Company', 'Name']) || ticker}</div>
                                    <div class="text-[10px] text-zinc-500 font-mono tracking-wider">${ticker}</div>
                                </td>
                                <td class="p-4 text-right font-mono text-zinc-400">${shares}</td>
                                <td class="p-4 text-right font-medium">${symbol}${localPrice.toFixed(2)}</td>
                                <td class="p-4 text-right font-semibold">£${currentValGBP.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                <td class="p-4 text-right font-bold ${gbpProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                    £${gbpProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                </td>
                                <td class="p-4 text-right font-bold ${gbpProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                    ${returnPct.toFixed(2)}%
                                </td>
                                <td class="p-4 text-right">
                                    <div class="flex items-center justify-end gap-3">
                                        <span class="text-xs text-zinc-500 font-medium">${weight.toFixed(1)}%</span>
                                        <div class="w-16 bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                                            <div class="bg-emerald-500 h-full" style="width: ${weight}%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>`;
                    });
                }
            });
        }
    </script>
</body>
</html>
