<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; }
        .nav-item.active { background: #10b9811a; color: #10b981; border-right: 3px solid #10b981; }
        .toggle-btn.active { background: #10b981; color: #000; font-weight: 700; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight text-white">Stock Dashboard</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-l-xl">
                <span>Overview</span>
            </div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-l-xl text-zinc-500 hover:text-white">
                <span>Holdings</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p class="text-zinc-500 text-sm mb-1 uppercase tracking-widest font-bold">Total Portfolio Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right">
                    <p id="date-label" class="text-zinc-500 text-xs font-mono">--/--/----</p>
                </div>
            </header>

            <div class="card p-6 mb-8">
                <div class="flex justify-between items-center mb-8">
                    <h3 id="chart-title" class="font-semibold text-zinc-300">Net Total Value</h3>
                    <div class="flex bg-black/40 p-1 rounded-xl">
                        <button id="btn-growth" onclick="updateChart('growth')" class="toggle-btn active px-4 py-1 rounded-lg text-[10px] uppercase">Growth</button>
                        <button id="btn-profit" onclick="updateChart('profit')" class="toggle-btn px-4 py-1 rounded-lg text-[10px] uppercase ml-1">Profit</button>
                    </div>
                </div>
                <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
            </div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10">
                <h1 class="text-4xl font-bold tracking-tight text-white">Current Assets</h1>
                <p class="text-zinc-500 mt-2">Breakdown from latest holdings update.</p>
            </header>
            
            <div class="card overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-[10px] uppercase tracking-[0.2em] font-bold">
                        <tr>
                            <th class="p-4">Company</th>
                            <th class="p-4">Ticker</th>
                            <th class="p-4 text-right">Shares Owned</th>
                            <th class="p-4 text-right">Avg Price</th>
                            <th class="p-4 text-right">Total Value</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800/50">
                        <tr><td colspan="5" class="p-10 text-center text-zinc-600">Loading holdings data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PERF_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        const HOLD_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Holdings.csv';
        
        let chartInstance;
        let perfData = [];

        // 1. Fetch Performance Data for Dashboard
        Papa.parse(PERF_CSV, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                perfData = results.data.slice(1).filter(r => r[0] && r[49]);
                initDashboard();
            }
        });

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            document.getElementById('nav-dash').classList.toggle('active', pageId === 'dashboard');
            document.getElementById('nav-holdings').classList.toggle('active', pageId === 'holdings');
            if(pageId === 'holdings') fetchAndRenderHoldings();
        }

        function initDashboard() {
            const latest = perfData[perfData.length - 1];
            document.getElementById('hero-val').innerText = '£' + parseFloat(latest[49]).toLocaleString();
            document.getElementById('date-label').innerText = `LAST UPDATED: ${latest[0]}`;
            renderChart('growth');
        }

        // 2. Fetch and Render the new Holdings.csv
        function fetchAndRenderHoldings() {
            Papa.parse(HOLD_CSV, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const tbody = document.getElementById('holdings-table-body');
                    tbody.innerHTML = '';
                    
                    results.data.forEach(row => {
                        const val = parseFloat(row.Value) || 0;
                        tbody.innerHTML += `
                            <tr class="hover:bg-white/[0.02] transition">
                                <td class="p-4 font-semibold text-zinc-100">${row.Company}</td>
                                <td class="p-4"><span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] font-bold">${row.Ticker}</span></td>
                                <td class="p-4 text-right font-mono">${row.Shares}</td>
                                <td class="p-4 text-right text-zinc-400 font-mono">$${parseFloat(row.Price).toFixed(2)}</td>
                                <td class="p-4 text-right font-bold text-emerald-400 font-mono">$${val.toLocaleString()}</td>
                            </tr>
                        `;
                    });
                }
            });
        }

        function renderChart(type) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const labels = perfData.map(r => {
                const p = r[0].split('/');
                return new Date(p[2], p[0]-1, p[1]).toLocaleString('default', {month:'short', year:'2-digit'});
            });
            const config = type === 'growth' ? 
                { data: perfData.map(r => parseFloat(r[49])), color: '#10b981' } : 
                { data: perfData.map(r => parseFloat(r[51])), color: '#6366f1' };

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: config.data,
                        borderColor: config.color,
                        borderWidth: 2.5,
                        pointRadius: 0,
                        tension: 0.35,
                        fill: true,
                        backgroundColor: config.color + '0D'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#52525b', maxTicksLimit: 12, font: { size: 10 } } },
                        y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#52525b', font: { size: 10 } } }
                    }
                }
            });
        }

        function updateChart(type) {
            document.getElementById('btn-growth').classList.toggle('active', type === 'growth');
            document.getElementById('btn-profit').classList.toggle('active', type === 'profit');
            document.getElementById('chart-title').innerText = type === 'growth' ? 'Portfolio Growth' : 'Net Profit History';
            renderChart(type);
        }
    </script>
</body>
</html>
