<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; color: #71717a; }
        .nav-item.active { background: #10b9811a; color: #10b981; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-xl">
                <span>Dashboard</span>
            </div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-xl">
                <span>Holdings</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right">
                    <p id="date-label" class="text-zinc-500 text-sm">--/--/----</p>
                </div>
            </header>

            <div class="card p-6 mb-8">
                <h3 class="font-semibold text-zinc-300 mb-6">Portfolio Growth</h3>
                <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Net Profit</p>
                    <p id="stat-profit" class="text-2xl font-bold text-emerald-400">£0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Deposits</p>
                    <p id="stat-deposits" class="text-2xl font-bold">£0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Dividends & Fees</p>
                    <p id="stat-fees" class="text-2xl font-bold">£0.00</p>
                </div>
            </div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10">
                <h1 class="text-4xl font-bold tracking-tight">Your Assets</h1>
                <p class="text-zinc-500 mt-2">Current breakdown from Holdings.csv</p>
            </header>
            
            <div class="card overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-xs uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4">Company</th>
                            <th class="p-4">Ticker</th>
                            <th class="p-4 text-right">Shares</th>
                            <th class="p-4 text-right">Avg Price</th>
                            <th class="p-4 text-right">Value</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800">
                        <tr><td colspan="5" class="p-10 text-center text-zinc-600">Waiting for Holdings.csv...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PERF_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        const HOLD_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Holdings.csv';
        
        let chartInstance;
        let perfData = [];

        // Load Performance Data
        Papa.parse(PERF_CSV, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                perfData = results.data.filter(r => r.Date && r['Net Total Value GBP']);
                initDashboard();
            }
        });

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            document.getElementById('nav-dash').classList.toggle('active', pageId === 'dashboard');
            document.getElementById('nav-holdings').classList.toggle('active', pageId === 'holdings');
            if(pageId === 'holdings') renderHoldings();
        }

        function initDashboard() {
            const latest = perfData[perfData.length - 1];
            document.getElementById('hero-val').innerText = '£' + parseFloat(latest['Net Total Value GBP']).toLocaleString();
            document.getElementById('date-label').innerText = latest.Date;
            document.getElementById('stat-profit').innerText = '£' + parseFloat(latest['Net Profit']).toLocaleString();
            document.getElementById('stat-deposits').innerText = '£' + parseFloat(latest['Cumulative Deposits']).toLocaleString();
            document.getElementById('stat-fees').innerText = '£' + parseFloat(latest['Dividends & Fees']).toLocaleString();
            renderChart();
        }

        function renderHoldings() {
            Papa.parse(HOLD_CSV, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const tbody = document.getElementById('holdings-table-body');
                    tbody.innerHTML = '';
                    results.data.forEach(row => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-white/5 transition">
                                <td class="p-4 font-semibold text-white">${row.Company}</td>
                                <td class="p-4 text-xs font-bold text-zinc-500">${row.Ticker}</td>
                                <td class="p-4 text-right">${row.Shares}</td>
                                <td class="p-4 text-right">$${parseFloat(row.Price).toFixed(2)}</td>
                                <td class="p-4 text-right font-semibold text-emerald-400">$${parseFloat(row.Value).toLocaleString()}</td>
                            </tr>
                        `;
                    });
                }
            });
        }

        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const labels = perfData.map(r => r.Date);
            const dataValues = perfData.map(r => parseFloat(r['Net Total Value GBP']));

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        borderColor: '#10b981',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: 'rgba(16, 185, 129, 0.05)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#52525b', font: { size: 10 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
