<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; color: #71717a; }
        .nav-item.active { background: #10b9811a; color: #10b981; }
        .toggle-btn { cursor: pointer; transition: all 0.2s; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .toggle-btn.active { background: #10b981; color: #000; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-xl"><span>Dashboard</span></div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-xl"><span>Holdings</span></div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right"><p id="date-label" class="text-zinc-500 text-sm">--/--/----</p></div>
            </header>

            <div class="card p-6 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-semibold text-zinc-300">Portfolio Growth</h3>
                    <div class="flex bg-black/40 p-1 rounded-xl">
                        <button id="btn-growth" onclick="updateChart('growth')" class="toggle-btn active px-4 py-1.5">Value</button>
                        <button id="btn-profit" onclick="updateChart('profit')" class="toggle-btn px-4 py-1.5 ml-1">Profit</button>
                    </div>
                </div>
                <div class="h-[350px]"><canvas id="mainChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="card p-6"><p class="text-zinc-500 text-xs font-bold uppercase mb-2">Total Return</p><p id="stat-total-return" class="text-2xl font-bold">0.00%</p></div>
                <div class="card p-6 border-l-4 border-rose-500"><p class="text-zinc-500 text-xs font-bold uppercase mb-2">Maximum Drawdown</p><p id="stat-max-dd" class="text-2xl font-bold text-rose-400">0.00%</p></div>
                <div class="card p-6 border-l-4 border-emerald-500"><p class="text-zinc-500 text-xs font-bold uppercase mb-2">Net Profit</p><p id="stat-profit" class="text-2xl font-bold text-emerald-400">£0.00</p></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card p-6"><p class="text-zinc-500 text-xs font-bold uppercase mb-2">TWR (Annualized)</p><p id="stat-twr" class="text-2xl font-bold text-blue-400">0.00%</p></div>
                <div class="card p-6"><p class="text-zinc-500 text-xs font-bold uppercase mb-2">Sharpe Ratio</p><p id="stat-sharpe" class="text-2xl font-bold">0.00</p></div>
                <div class="card p-6 border-l-4 border-amber-500"><p class="text-zinc-500 text-xs font-bold uppercase mb-2">Beta (vs S&P 500)</p><p id="stat-beta" class="text-2xl font-bold text-amber-400">0.00</p></div>
            </div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10"><h1 class="text-4xl font-bold tracking-tight">Holdings</h1></header>
            <div class="card overflow-x-auto">
                <table class="w-full text-left min-w-[950px]">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-4">Company</th><th class="p-4 text-right">Shares</th><th class="p-4 text-right">Mkt Price</th><th class="p-4 text-right">GBP Value</th><th class="p-4 text-right">P/L (£)</th><th class="p-4 text-right">P/L (%)</th><th class="p-4 text-right">Allocation</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PERF_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        const HOLD_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Holdings.csv';
        
        let chartInstance, perfData = [], headerRow = [], rates = { USD: 1, EUR: 1 }, totalValAtLatestDate = 0;

        function cleanNum(val) {
            if (!val) return 0;
            return parseFloat(val.toString().replace(/[^0-9.-]+/g, "")) || 0;
        }

        function getCol(row, keys) {
            const rowKeys = Object.keys(row);
            for (let key of keys) {
                const found = rowKeys.find(rk => rk.toLowerCase().trim() === key.toLowerCase().trim());
                if (found) return row[found];
            }
            return null;
        }

        Papa.parse(PERF_CSV, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                headerRow = results.data[0];
                perfData = results.data.slice(1).filter(r => r[0] && r[47]);
                const latest = perfData[perfData.length - 1];
                rates.USD = cleanNum(latest[43]); 
                rates.EUR = cleanNum(latest[45]);
                totalValAtLatestDate = cleanNum(latest[47]);
                initDashboard();
            }
        });

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            if(pageId === 'holdings') renderHoldings();
        }

        function initDashboard() {
            const latest = perfData[perfData.length - 1];
            const netProfit = cleanNum(latest[51]);
            const cumulativeDeposits = cleanNum(latest[50]);

            document.getElementById('hero-val').innerText = '£' + totalValAtLatestDate.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('date-label').innerText = latest[0];
            document.getElementById('stat-profit').innerText = '£' + netProfit.toLocaleString();
            document.getElementById('stat-total-return').innerText = (cumulativeDeposits !== 0 ? (netProfit / cumulativeDeposits) * 100 : 0).toFixed(2) + '%';

            const values = perfData.map(r => cleanNum(r[47]));
            const deposits = perfData.map(r => cleanNum(r[50]));
            const spIndex = headerRow.findIndex(h => h.trim().toUpperCase() === 'S&P500' || h.trim().toUpperCase() === 'S&P 500');
            const marketPrices = spIndex !== -1 ? perfData.map(r => cleanNum(r[spIndex])) : [];
            
            let cumFactor = 1, dailyReturns = [], marketReturns = [], peak = values[0], maxDD = 0;

            for (let i = 1; i < perfData.length; i++) {
                const denom = values[i-1] + (deposits[i] - deposits[i-1]);
                if (denom > 0) {
                    const r = (values[i] / denom) - 1;
                    cumFactor *= (1 + r);
                    dailyReturns.push(r);
                    if (marketPrices.length > 0 && marketPrices[i-1] !== 0) {
                        marketReturns.push((marketPrices[i] / marketPrices[i-1]) - 1);
                    }
                }
                if (values[i] > peak) peak = values[i];
                const dd = (values[i] - peak) / peak;
                if (dd < maxDD) maxDD = dd;
            }

            const years = (new Date(latest[0]) - new Date(perfData[0][0])) / (1000*60*60*24*365.25) || 1;
            document.getElementById('stat-twr').innerText = ((Math.pow(cumFactor, 1 / years) - 1) * 100).toFixed(2) + '%';
            document.getElementById('stat-max-dd').innerText = (maxDD * 100).toFixed(2) + '%';

            const meanRet = dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length;
            const stdDev = Math.sqrt(dailyReturns.map(x => Math.pow(x - meanRet, 2)).reduce((a, b) => a + b, 0) / dailyReturns.length);
            document.getElementById('stat-sharpe').innerText = (stdDev !== 0 ? ((meanRet * 252) - 0.04) / (stdDev * Math.sqrt(252)) : 0).toFixed(2);

            if (marketReturns.length > 0) {
                const meanM = marketReturns.reduce((a, b) => a + b, 0) / marketReturns.length;
                let num = 0, den = 0;
                for (let i = 0; i < marketReturns.length; i++) {
                    num += (dailyReturns[i] - meanRet) * (marketReturns[i] - meanM);
                    den += Math.pow(marketReturns[i] - meanM, 2);
                }
                document.getElementById('stat-beta').innerText = (den !== 0 ? num / den : 0).toFixed(2);
            }
            renderChart('growth');
        }

        function renderChart(type) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const dataVals = type === 'growth' ? perfData.map(r => cleanNum(r[47])) : perfData.map(r => cleanNum(r[51]));
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: perfData.map(r => r[0]),
                    datasets: [{ data: dataVals, borderColor: type === 'growth' ? '#10b981' : '#3b82f6', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true, backgroundColor: 'rgba(16,185,129,0.05)' }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }}, scales: { x: { display: false }, y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#52525b', font: { size: 10 } }}}}
            });
        }

        function updateChart(type) {
            document.getElementById('btn-growth').classList.toggle('active', type === 'growth');
            document.getElementById('btn-profit').classList.toggle('active', type === 'profit');
            renderChart(type);
        }

        function renderHoldings() {
            Papa.parse(HOLD_CSV, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const tbody = document.getElementById('holdings-table-body');
                    tbody.innerHTML = '';
                    results.data.forEach(row => {
                        const shares = cleanNum(getCol(row, ['Shares', 'Qty']));
                        if (shares <= 0) return;
                        const currency = (getCol(row, ['Currency']) || 'USD').toUpperCase();
                        const rate = (currency === 'GBP') ? 1 : (currency === 'EUR' ? rates.EUR : rates.USD);
                        const symbol = (currency === 'GBP') ? '£' : (currency === 'EUR' ? '€' : '$');
                        const mktPrice = cleanNum(getCol(row, ['Price']));
                        const currentValGBP = (shares * mktPrice) / rate;
                        const totalCostLocal = cleanNum(getCol(row, ['Total Cost']));
                        const costGBP = (currency === 'GBP') ? totalCostLocal : totalCostLocal / rate;
                        const gbpProfit = currentValGBP - costGBP;
                        const returnPct = costGBP !== 0 ? (gbpProfit / costGBP) * 100 : 0;
                        const weight = totalValAtLatestDate > 0 ? (currentValGBP / totalValAtLatestDate) * 100 : 0;

                        tbody.innerHTML += `
                            <tr class="hover:bg-white/5 transition border-b border-zinc-800/50 text-sm">
                                <td class="p-4"><div class="font-bold text-white">${getCol(row, ['Company', 'Name']) || 'Unknown'}</div><div class="text-[10px] text-zinc-500 font-mono uppercase">${getCol(row, ['Ticker', 'Symbol']) || '---'}</div></td>
                                <td class="p-4 text-right font-mono">${shares}</td>
                                <td class="p-4 text-right">${symbol}${mktPrice.toFixed(2)}</td>
                                <td class="p-4 text-right font-medium">£${currentValGBP.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                                <td class="p-4 text-right font-semibold ${gbpProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">£${gbpProfit.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                                <td class="p-4 text-right font-bold ${gbpProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${returnPct.toFixed(2)}%</td>
                                <td class="p-4 text-right"><div class="flex items-center justify-end gap-3"><span>${weight.toFixed(1)}%</span><div class="w-12 bg-zinc-800 h-1 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${weight}%"></div></div></div></td>
                            </tr>`;
                    });
                }
            });
        }
    </script>
</body>
</html>
