<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .toggle-btn { transition: all 0.2s; border: 1px solid transparent; color: #71717a; }
        .toggle-btn.active { background: #10b981; color: #000; font-weight: 700; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #2B2F36; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-2 mb-10">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-black font-bold italic">P</div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div class="flex items-center gap-3 text-emerald-400 font-medium bg-emerald-500/10 p-3 rounded-xl cursor-default">
                <span>Dashboard</span>
            </div>
            <div class="flex items-center gap-3 text-zinc-500 p-3 hover:text-white transition cursor-pointer">
                <span>Holdings</span>
            </div>
        </nav>
        <div class="mt-auto p-4 bg-zinc-900/50 rounded-xl text-[10px] text-zinc-600 uppercase tracking-widest font-bold">
            Live CSV Source
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10 custom-scroll">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-6">
            <div>
                <p class="text-zinc-500 text-sm font-medium mb-1">Net Total Value</p>
                <div class="flex items-baseline gap-4">
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                    <div id="profit-pill" class="px-3 py-1 rounded-full text-xs font-bold flex items-center">
                        <span id="hero-profit">--</span>
                    </div>
                </div>
            </div>
            <div class="text-right border-l border-zinc-800 pl-6 hidden md:block">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest">Last Update</p>
                <p id="date-label" class="text-zinc-200 font-medium text-sm">--/--/----</p>
            </div>
        </header>

        <div class="card p-6 mb-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                <h3 id="chart-title" class="font-semibold text-zinc-300">Net Total Value Over Time</h3>
                
                <div class="flex bg-black/40 p-1 rounded-xl">
                    <button id="btn-growth" onclick="updateChart('growth')" class="toggle-btn active px-4 py-1.5 rounded-lg text-[10px] uppercase tracking-widest">Growth</button>
                    <button id="btn-profit" onclick="updateChart('profit')" class="toggle-btn px-4 py-1.5 rounded-lg text-[10px] uppercase tracking-widest ml-1">Profit</button>
                </div>
            </div>

            <div class="h-[320px] w-full">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Net Profit</p>
                <p id="stat-profit" class="text-2xl font-bold text-emerald-400">£0.00</p>
            </div>
            <div class="card p-6">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Deposits</p>
                <p id="stat-deposits" class="text-2xl font-bold text-zinc-100">£0.00</p>
            </div>
            <div class="card p-6">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Dividends & Fees</p>
                <p id="stat-fees" class="text-2xl font-bold text-zinc-100">£0.00</p>
            </div>
        </div>
    </main>

    <script>
        const CSV_URL = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        let chartInstance;
        let globalData = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                globalData = results.data.filter(r => r.Date && r['Net Total Value GBP']);
                initUI();
            }
        });

        function initUI() {
            const latest = globalData[globalData.length - 1];
            
            // Text values
            document.getElementById('hero-val').innerText = '£' + parseFloat(latest['Net Total Value GBP']).toLocaleString();
            document.getElementById('date-label').innerText = latest.Date;
            document.getElementById('stat-profit').innerText = '£' + parseFloat(latest['Net Profit']).toLocaleString();
            document.getElementById('stat-deposits').innerText = '£' + parseFloat(latest['Cumulative Deposits']).toLocaleString();
            document.getElementById('stat-fees').innerText = '£' + parseFloat(latest['Dividends & Fees']).toLocaleString();

            const profit = parseFloat(latest['Net Profit']);
            const pill = document.getElementById('profit-pill');
            document.getElementById('hero-profit').innerText = (profit >= 0 ? '+' : '') + '£' + profit.toLocaleString();
            pill.className = profit >= 0 ? 'bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold' : 'bg-rose-500/10 text-rose-400 px-3 py-1 rounded-full text-xs font-bold';

            renderChart('growth');
        }

        function renderChart(type) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            // Format labels to show MONTH and YEAR (e.g., Aug 20)
            const labels = globalData.map(r => {
                const parts = r.Date.split('/');
                const d = new Date(parts[2], parts[0] - 1, parts[1]);
                return d.toLocaleString('default', { month: 'short', year: '2-digit' });
            });

            const datasets = {
                growth: {
                    data: globalData.map(r => parseFloat(r['Net Total Value GBP'])),
                    color: '#10b981',
                    label: 'Net Total Value'
                },
                profit: {
                    data: globalData.map(r => parseFloat(r['Net Profit'])),
                    color: '#6366f1',
                    label: 'Net Profit'
                }
            };

            const config = datasets[type];

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: config.data,
                        borderColor: config.color,
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: true,
                        backgroundColor: (context) => {
                            const gradient = context.chart.ctx.createLinearGradient(0, 0, 0, 320);
                            gradient.addColorStop(0, config.color + '33'); // 20% opacity
                            gradient.addColorStop(1, config.color + '00'); // 0% opacity
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            grid: { display: false },
                            ticks: { color: '#52525b', autoSkip: true, maxTicksLimit: 12, font: { size: 10 } } 
                        },
                        y: { 
                            position: 'right',
                            grid: { color: 'rgba(255,255,255,0.03)' },
                            ticks: { color: '#52525b', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateChart(type) {
            document.getElementById('btn-growth').classList.toggle('active', type === 'growth');
            document.getElementById('btn-profit').classList.toggle('active', type === 'profit');
            document.getElementById('chart-title').innerText = type === 'growth' ? 'Net Total Value Over Time' : 'Net Profit Over Time';
            renderChart(type);
        }
    </script>
</body>
</html>
