<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0E11; color: #FFFFFF; }
        .sidebar { background-color: #15191C; border-right: 1px solid #2B2F36; }
        .card { background-color: #15191C; border: 1px solid #2B2F36; border-radius: 16px; }
        .nav-item { cursor: pointer; transition: all 0.2s; color: #71717a; }
        .nav-item.active { background: #10b9811a; color: #10b981; }
        .toggle-btn { cursor: pointer; transition: all 0.2s; border-radius: 8px; font-size: 11px; font-weight: 700; color: #71717a; }
        .toggle-btn.active { background: #10b981; color: #000; }
        .period-btn { cursor: pointer; transition: all 0.2s; border-radius: 8px; font-size: 11px; font-weight: 600; background: #1e2327; color: #a1a1aa; border: 1px solid #2B2F36; }
        .period-btn.active { border-color: #10b981; color: #10b981; background: #10b9810d; }
        .hidden { display: none; }
        .logo-container { width: 32px; height: 32px; overflow: hidden; border-radius: 8px; background: #1e2327; display: flex; align-items: center; justify-content: center; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; }
        th.sortable:hover { color: white; cursor: pointer; }

        .tooltip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: #2B2F36; color: #71717a; border-radius: 50%; font-size: 10px; cursor: help; font-style: normal; margin-left: 6px; }
        .tooltip .tooltiptext {
            visibility: hidden; width: 220px; background-color: #1e2327; color: #fff; text-align: center;
            border-radius: 6px; padding: 10px; position: absolute; z-index: 100; opacity: 0; transition: opacity 0.2s; 
            font-size: 11px; line-height: 1.4; border: 1px solid #2B2F36; pointer-events: none; text-transform: none; font-weight: normal;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .dash-tooltip .tooltiptext { bottom: 125%; left: 50%; margin-left: -110px; }
        .hold-tooltip .tooltiptext { top: 125%; right: 0; }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }

        .refresh-btn { background: #10b981; color: #000; font-weight: 700; font-size: 12px; padding: 8px 16px; border-radius: 8px; transition: opacity 0.2s; }
        .refresh-btn:hover { opacity: 0.9; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="flex items-center gap-3 mb-10">
            <div class="logo-container"><img src="logo.png" alt="Logo" class="logo-img"></div>
            <span class="text-xl font-bold tracking-tight">Portfolio</span>
        </div>
        <nav class="space-y-2 flex-1">
            <div id="nav-dash" onclick="showPage('dashboard')" class="nav-item active flex items-center gap-3 p-3 rounded-xl"><span>Dashboard</span></div>
            <div id="nav-holdings" onclick="showPage('holdings')" class="nav-item flex items-center gap-3 p-3 rounded-xl"><span>Holdings</span></div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <div id="page-dashboard">
            <header class="flex justify-between items-end mb-8">
                <div>
                    <p class="text-zinc-500 text-sm mb-1">Total Net Value</p>
                    <h1 id="hero-val" class="text-5xl font-bold tracking-tight">£0.00</h1>
                </div>
                <div class="text-right"><p id="date-label" class="text-zinc-500 text-sm">--/--/----</p></div>
            </header>
            <div class="card p-6 mb-8 h-[350px]"><canvas id="mainChart"></canvas></div>
        </div>

        <div id="page-holdings" class="hidden">
            <header class="mb-10 flex justify-between items-center">
                <h1 class="text-4xl font-bold tracking-tight">Holdings</h1>
                <button onclick="refreshLivePrices()" class="refresh-btn">Refresh Live Prices</button>
            </header>
            <div class="card overflow-x-auto">
                <table class="w-full text-left min-w-[1200px]">
                    <thead class="bg-zinc-900/50 text-zinc-500 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-4 sortable" onclick="sortHoldings('Company')">Company ↕</th>
                            <th class="p-4 text-right sortable" onclick="sortHoldings('Shares')">Shares ↕</th>
                            <th class="p-4 text-right">BEP Price ↕</th>
                            <th class="p-4 text-right text-emerald-400 font-bold">Live Price 🟢</th>
                            <th class="p-4 text-right">Market Price ↕</th>
                            <th class="p-4 text-right">£ Value ↕</th>
                            <th class="p-4 text-right">£ P/L ↕</th>
                            <th class="p-4 text-right">% P/L ↕</th>
                            <th class="p-4 text-right">Allocation ↕</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PERF_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Performance.csv';
        const HOLD_CSV = 'https://raw.githubusercontent.com/stocksandcofe-beep/Stock-Portfolio/main/Holdings.csv';
        const LIVE_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSXM1dYBxznBus1fR27mZ9AEfISwr54qMJHTsw6cSyPs7LAwV1sw6Y8zpC7V3gwCcH854_HudCUPEm/pub?gid=0&single=true&output=csv';
        
        let chartInstance, rawPerfData = [], currentHoldingsData = [], livePriceMap = {}, currentPeriod = 'all', currentChartMode = 'growth', totalValLatest = 0;
        let sortDir = -1, lastSortKey = '';

        function cleanNum(val) { return parseFloat(val?.toString().replace(/[^0-9.-]+/g, "")) || 0; }
        function getCol(row, keys) {
            const rKeys = Object.keys(row);
            for (let k of keys) { 
                const f = rKeys.find(rk => rk.toLowerCase().trim() === k.toLowerCase().trim());
                if (f) return row[f];
            }
            return null;
        }
        function parseDate(dStr) { const p = dStr.split('/'); return new Date(p[2], p[0]-1, p[1]); }

        Papa.parse(PERF_CSV, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                rawPerfData = results.data.slice(1).filter(r => r[0] && r[47]);
                totalValLatest = cleanNum(rawPerfData[rawPerfData.length-1][47]);
                initDashboard();
                fetchLivePrices(true);
            }
        });

        function fetchLivePrices(isInitial = false) {
            Papa.parse(LIVE_CSV, {
                download: true, header: false, skipEmptyLines: true,
                complete: function(results) {
                    results.data.forEach(row => {
                        const ticker = row[0]?.toUpperCase().trim();
                        if (ticker) {
                            livePriceMap[ticker] = {
                                price: cleanNum(row[1]),
                                rate: cleanNum(row[2]) || 1.0 
                            };
                        }
                    });
                    if(!isInitial) fetchHoldings();
                }
            });
        }

        function refreshLivePrices() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerText = 'Refreshing...';
            fetchLivePrices(false);
            setTimeout(() => { btn.innerText = 'Refresh Live Prices'; }, 1000);
        }

        function showPage(pageId) {
            document.getElementById('page-dashboard').classList.toggle('hidden', pageId !== 'dashboard');
            document.getElementById('page-holdings').classList.toggle('hidden', pageId !== 'holdings');
            document.getElementById('nav-dash').classList.toggle('active', pageId === 'dashboard');
            document.getElementById('nav-holdings').classList.toggle('active', pageId === 'holdings');
            if(pageId === 'holdings') fetchHoldings();
        }

        function updatePeriod(p) {
            currentPeriod = p;
            initDashboard();
        }

        function updateChartMode(m) {
            currentChartMode = m;
            initDashboard();
        }

        function initDashboard() {
            if (!rawPerfData.length) return;
            const end = rawPerfData[rawPerfData.length - 1];
            document.getElementById('hero-val').innerText = '£' + cleanNum(end[47]).toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('date-label').innerText = end[0];
            renderChart(rawPerfData);
        }

        function renderChart(data) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(r => r[0]),
                    datasets: [{
                        data: data.map(r => currentChartMode === 'growth' ? cleanNum(r[47]) : cleanNum(r[51])),
                        borderColor: '#10b981', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function fetchHoldings() {
            Papa.parse(HOLD_CSV, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    currentHoldingsData = results.data.filter(r => getCol(r, ['Ticker']) && cleanNum(getCol(r, ['Shares'])) > 0);
                    displayHoldings(currentHoldingsData);
                }
            });
        }

        function sortHoldings(key) {
            if (lastSortKey === key) sortDir *= -1; else { sortDir = -1; lastSortKey = key; }
            currentHoldingsData.sort((a, b) => {
                let vA = getCol(a, [key]), vB = getCol(b, [key]);
                if (key !== 'Company') { vA = cleanNum(vA); vB = cleanNum(vB); }
                return vA < vB ? -1 * sortDir : vA > vB ? 1 * sortDir : 0;
            });
            displayHoldings(currentHoldingsData);
        }

        function displayHoldings(data) {
            const tbody = document.getElementById('holdings-table-body');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                const ticker = getCol(row, ['Ticker'])?.toUpperCase().trim();
                const shares = cleanNum(getCol(row, ['Shares']));
                const bepLocal = cleanNum(getCol(row, ['BEP Price']));
                const histPriceLocal = cleanNum(getCol(row, ['Current Price']));
                
                const liveData = livePriceMap[ticker];
                
                // 1. Current Price to use
                const activePriceLocal = liveData ? liveData.price : histPriceLocal;
                const activeRate = liveData ? liveData.rate : 1.0;
                
                // 2. Percent Return Calculation (Purely Price vs Price)
                // This ignores FX to give you the "Stock Performance"
                let percReturn = ((activePriceLocal / bepLocal) - 1) * 100;
                
                // 3. Value Calculation (GBP)
                let curValueGBP = (shares * activePriceLocal) * activeRate;
                
                // 4. P/L Calculation (GBP)
                // We use your STATIC "Current Value" and "Total Unrealised P/L" 
                // to work backward to your GBP Cost if Live data isn't perfect,
                // OR calculate fresh:
                let staticValueGBP = cleanNum(getCol(row, ['Current Value']));
                let staticPLGBP = cleanNum(getCol(row, ['Total Unrealised P/L']));
                let costGBP = staticValueGBP - staticPLGBP;
                
                let profitGBP = curValueGBP - costGBP;
                
                // Override with Static data if Live isn't available to keep it consistent
                if (!liveData) {
                    percReturn = cleanNum(getCol(row, ['% Return']).replace('%',''));
                    profitGBP = staticPLGBP;
                    curValueGBP = staticValueGBP;
                }

                const weight = totalValLatest > 0 ? (curValueGBP / totalValLatest) * 100 : 0;
                let sym = (ticker === 'WKL') ? '€' : (ticker === 'UL' ? '£' : '$');
                
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition border-b border-zinc-800/50 text-sm">
                        <td class="p-4" style="background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) ${weight}%, transparent ${weight}%);">
                            <div class="font-bold text-white">${getCol(row, ['Company'])}</div>
                            <div class="text-[10px] text-zinc-500 font-mono uppercase">${ticker}</div>
                        </td>
                        <td class="p-4 text-right font-mono text-zinc-400">${shares}</td>
                        <td class="p-4 text-right text-zinc-300">${sym}${bepLocal.toFixed(2)}</td>
                        <td class="p-4 text-right font-bold text-emerald-400">
                            ${liveData ? sym + activePriceLocal.toFixed(2) : '--'}
                        </td>
                        <td class="p-4 text-right text-zinc-300">${sym}${histPriceLocal.toFixed(2)}</td>
                        <td class="p-4 text-right font-medium text-white">£${curValueGBP.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        <td class="p-4 text-right font-semibold ${profitGBP >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                            ${profitGBP >= 0 ? '+' : ''}£${profitGBP.toLocaleString(undefined, {maximumFractionDigits:0})}
                        </td>
                        <td class="p-4 text-right font-bold ${percReturn >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                            ${percReturn >= 0 ? '+' : ''}${percReturn.toFixed(2)}%
                        </td>
                        <td class="p-4 text-right font-medium text-zinc-300">${weight.toFixed(1)}%</td>
                    </tr>`;
            });
        }
    </script>
</body>
</html>
