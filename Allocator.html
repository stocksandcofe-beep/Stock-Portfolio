<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Allocator | Portfolio</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6">
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo" class="logo-img">
                </div>
                <span class="text-xl font-bold tracking-tight">Portfolio</span>
            </div>
            
            <div class="flex gap-4 px-1">
                <a href="https://stocksandcoffee.substack.com/" target="_blank" class="social-icon">
                    <i data-lucide="bookmark" class="w-4 h-4"></i>
                </a>
                <a href="https://x.com/StocksandCoffe" target="_blank" class="social-icon">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
        
        <nav class="space-y-2 flex-1">
            <div onclick="window.location.href='index.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Dashboard</span>
            </div>
            <div onclick="window.location.href='index.html#holdings'" class="nav-item flex items-center gap-3 p-3 rounded-xl">
                <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                <span>Holdings</span>
            </div>
            <div class="nav-item active flex items-center gap-3 p-3 rounded-xl">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>Asset Allocator</span>
            </div>
        </nav>
    </aside>

  <main class="flex-1 overflow-y-auto p-6 md:p-10">
    <header class="mb-8">
        <h1 class="text-4xl font-bold tracking-tight">Asset Allocator</h1>
        <p class="text-zinc-500 mt-2">Plan and rebalance your portfolio allocation targets.</p>
    </header>

    <div class="max-w-2xl mb-10">
        <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-emerald-400 transition-colors">
                <i data-lucide="search" class="w-5 h-5"></i>
            </div>
            <input 
                type="text" 
                id="asset-search" 
                placeholder="Search company, ticker, or ETF (e.g. Google, GOOGL, iShares...)" 
                class="w-full bg-zinc-900/50 border border-zinc-800 text-white text-sm rounded-2xl block pl-12 p-4 focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all placeholder:text-zinc-600"
            >
        </div>
        <div id="search-results" class="hidden mt-2 bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-2xl absolute z-50 w-full max-w-2xl">
            </div>
    </div>

    <div id="selection-container" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="card p-8 bg-zinc-900/40 border-l-4 border-emerald-500">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <h2 id="selected-ticker" class="text-3xl font-bold tracking-tighter text-white">---</h2>
                        <span id="selected-type" class="text-[10px] bg-zinc-800 text-zinc-500 px-2 py-1 rounded uppercase font-mono tracking-widest">Asset</span>
                    </div>
                    <p id="selected-name" class="text-zinc-400 font-medium">Loading asset details...</p>
                </div>

                <div class="flex flex-col md:items-end">
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-1">Live Market Price</p>
                    <div class="flex items-center gap-3">
                        <span id="live-price" class="text-4xl font-mono font-bold text-white">£0.00</span>
                        <div id="price-indicator" class="w-2 h-2 rounded-full bg-zinc-700 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card p-6 border-zinc-800/50">
                <h3 class="text-lg font-bold mb-4">Targeting Logic</h3>
                <p class="text-zinc-500 text-sm">Would you like to calculate how many shares you need to reach a specific % of your total portfolio?</p>
            </div>
        </div>
    </div>
</main>

    <script>
        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
