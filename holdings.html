<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Holdings</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Fixed Tooltip Styles */
        .tooltip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            background: #3f3f46;
            color: #a1a1aa;
            border-radius: 50%;
            font-size: 10px;
            cursor: help;
            margin-left: 6px;
            position: relative;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            /* Increased width and added padding/line-height for readability */
            width: 240px; 
            background-color: #18181b;
            color: #d4d4d8;
            text-align: center;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 12px;
            position: absolute;
            z-index: 100;
            bottom: 150%; /* Lifted higher to avoid clipping headers */
            left: 50%;
            transform: translateX(-50%); /* Better centering logic */
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
            font-weight: 400;
            line-height: 1.5;
            text-transform: none;
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            /* Prevents text from staying on one line and overflowing */
            white-space: normal; 
            word-wrap: break-word;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        .sortable:hover {
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-black text-white">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6 border-r border-zinc-800">
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo" class="logo-img">
                </div>
                <span class="text-xl font-bold tracking-tight">Portfolio</span>
            </div>
            
            <div class="flex gap-4 px-1">
                <a href="https://stocksandcoffee.substack.com/" target="_blank" class="social-icon">
                    <i data-lucide="bookmark" class="w-4 h-4"></i>
                </a>
                <a href="https://x.com/StocksandCoffe" target="_blank" class="social-icon">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
        
        <nav class="space-y-2 flex-1">
            <div onclick="window.location.href='index.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Performance</span>
            </div>
            <div class="nav-item active flex items-center gap-3 p-3 rounded-xl bg-emerald-500/10 text-emerald-400">
                <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                <span>Holdings</span>
            </div>
            <div onclick="window.location.href='Allocator.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>Asset Allocator</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <header class="mb-10 flex justify-between items-center">
            <h1 class="text-4xl font-bold tracking-tight">Holdings</h1>
            <button onclick="refreshLivePrices()" class="refresh-btn flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-xl hover:bg-zinc-800 transition-colors">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                Refresh Live Prices
            </button>
        </header>
        
        <div class="card overflow-x-auto">
            <table class="w-full text-left min-w-[1200px]">
                <thead class="bg-zinc-900/50 text-zinc-500 text-[10px] uppercase font-bold tracking-widest relative z-20">
                    <tr>
                        <th class="p-4 sortable" onclick="sortHoldings('Company')">Company ↕</th>
                        <th class="p-4 text-center sortable" onclick="sortHoldings('Shares')">Shares ↕</th>
                        <th class="p-4 text-center sortable" onclick="sortHoldings('BEP Price')">
                            <div class="flex items-center justify-end">BEP ↕ 
                                <span class="tooltip">? 
                                    <span class="tooltiptext">Break-even price is the price at which an asset, if sold, would pay for the costs of ownership. Any amount beyond the break-even price is profit.</span>
                                </span>
                            </div>
                        </th>
                        <th class="p-4 text-center text-emerald-400">Live Price</th>
                        <th class="p-4 text-center sortable" onclick="sortHoldings('Current Value')">£ Value ↕</th>
                        <th class="p-4 text-center sortable" onclick="sortHoldings('Total Unrealised P/L')">£ P/L ↕</th>
                        <th class="p-4 text-center sortable" onclick="sortHoldings('% Return')">% P/L ↕</th>
                        <th class="p-4 text-center sortable" onclick="sortHoldings('Allocation')">Allocation ↕</th>
                    </tr>
                </thead>
                <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="holdings.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
