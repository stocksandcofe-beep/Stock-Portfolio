<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Holdings</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-black text-white">

    <aside class="sidebar w-64 hidden lg:flex flex-col p-6 border-r border-zinc-800">
        <nav class="space-y-2 flex-1">
            <div onclick="window.location.href='performance.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors">
                <i data-lucide="chart-no-axes-combined" class="w-4 h-4"></i>
                <span>Performance</span>
            </div>
            <div class="nav-item active flex items-center gap-3 p-3 rounded-xl bg-emerald-500/10 text-emerald-400">
                <i data-lucide="wallet-cards" class="w-4 h-4"></i>
                <span>Holdings</span>
            </div>
            <div onclick="window.location.href='Allocator.html'" class="nav-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-zinc-900 transition-colors">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>Asset Allocator</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <header class="mb-10 flex justify-between items-center">
            <h1 class="text-4xl font-bold tracking-tight">Holdings</h1>
            <button onclick="refreshLivePrices()" class="refresh-btn">Refresh Live Prices</button>
        </header>
        <div class="card overflow-x-auto">
            <table class="w-full text-left min-w-[1200px]">
                <tbody id="holdings-table-body" class="text-zinc-300 divide-y divide-zinc-800"></tbody>
            </table>
        </div>
    </main>

    <script src="holdings.js"></script>
</body>
</html>
